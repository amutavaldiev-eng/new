{% extends 'base.html' %}
{% block content %}
<div class="box">
    <h2>Delete Question</h2>
    <p>Are you sure you want to delete this question?</p>
    <h3>{{ question.title }}</h3>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="/my-questions/">
            <button type="button">Cancel</button>
        </a>
    </form>
</div>

{% endblock %}
